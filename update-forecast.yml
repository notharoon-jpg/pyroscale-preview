# Legacy workflow template (root-level file, not an active GitHub Actions workflow).
# Intentionally no scheduled writes: the bundled October 2026 dataset is frozen,
# so retraining against it monthly would not add any new NASA observations.
# Use the validated pipeline scripts to rebuild from new archive data deliberately.
name: Validate PyroScale release manually
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python validate_release.py
