name: Verify PyroScale data pipeline
on:
  pull_request:
    paths:
      - "**/*.py"
      - "requirements.txt"
      - ".github/workflows/verify-pipeline.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned pipeline dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pipeline regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate released data without modifying it
        run: python validate_release.py
